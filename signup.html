<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký - MixiStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container py-2"><a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold"
                href="./index.html"><i class="bi bi-bag-check"></i>KhangSop</a></div>
    </nav>


    <main class="container py-5" style="max-width:520px;">
        <h1 class="h3 mb-4">Tạo tài khoản</h1>
        <form id="signupForm" class="vstack gap-3">
            <div><label class="form-label">Họ và tên</label><input type="text" id="signupName" class="form-control" required></div>
            <div><label class="form-label">Email</label><input type="email" id="signupEmail" class="form-control" required></div>
            <div><label class="form-label">Mật khẩu</label><input type="password" id="signupPass" class="form-control" minlength="6"
                    required></div>
            <div><label class="form-label">Nhập lại mật khẩu</label><input type="password" id="signupConfirm" class="form-control"
                    minlength="6" required></div>
            <button class="btn btn-primary" type="submit">Đăng ký</button>
            <p class="text-secondary">Đã có tài khoản? <a class="link-light" href="./login.html">Đăng nhập</a></p>
        </form>
    </main>


    <footer class="py-4">
        <div class="container d-flex justify-content-between">
            <div><strong class="text-dark">KhangSop</strong> © 2025</div>
            <div class="text-secondary">Hỗ trợ: <a class="link-light"
                    href="mailto:support@mixistyle.demo">duykhangpham1808@gmail.com</a></div>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
