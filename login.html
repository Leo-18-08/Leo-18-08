<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập - MixiStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container py-2"><a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold"
                href="Untitled-1.html"><i class="bi bi-bag-check"></i> MixiStyle</a></div>
    </nav>


    <main class="container py-5" style="max-width:480px;">
        <h1 class="h3 mb-4">Đăng nhập</h1>
        <form id="loginForm" class="vstack gap-3">
            <div><label class="form-label">Email</label><input type="email" id="loginEmail" class="form-control" required></div>
            <div><label class="form-label">Mật khẩu</label><input type="password" id="loginPass" class="form-control" required></div>
            <button class="btn btn-primary" type="submit">Đăng nhập</button>
            <p class="text-secondary">Chưa có tài khoản? <a class="link-light" href="./signup.html">Đăng ký</a></p>
        </form>
    </main>


    <footer class="py-4">
        <div class="container d-flex justify-content-between">
            <div><strong class="text-white">MixiStyle</strong> © 2025</div>
            <div class="text-secondary">Hỗ trợ: <a class="link-light"
                    href="mailto:support@mixistyle.demo">support@mixistyle.demo</a></div>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
</script>
